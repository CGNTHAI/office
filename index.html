<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CGN THAI 오피스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: header card → office (wall strip + wooden floor with three team rugs) → slide-in staff drawer */
  --wall:#bfe3dc; --wall-deep:#8ccabf; --floor:#e8cfa8; --floor-line:#d8b98c;
  --ink:#2b2833; --ink-soft:#6a6475; --paper:#fffdf7; --accent:#ff7657;
  --rug-production:#d4e3ff; --rug-support:#fff0c2; --rug-planning:#ffdbe7;
  --s-done:#1f9d63; --s-doing:#2f74e8; --s-plan:#8a8496; --s-blocked:#dc3d33; --s-moved:#d98a06;
  --display:"Jua","Gowun Dodum","Sarabun",system-ui,sans-serif;
  --body:"Gowun Dodum","Sarabun","Noto Sans KR",system-ui,sans-serif;
  --thai:"Sarabun","Noto Sans Thai",system-ui,sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--wall);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}

/* ---------- header ---------- */
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding:16px clamp(16px,3vw,32px) 12px}
.brand{display:flex;align-items:center;gap:12px}
.brand-badge{width:44px;height:44px;border-radius:14px;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:15px;letter-spacing:.5px;box-shadow:0 3px 0 #0003}
.brand h1{font-family:var(--display);font-weight:400;font-size:26px;margin:0;line-height:1.1}
.brand small{display:block;color:var(--ink-soft);font-size:13px}
.editbtn{display:block;width:100%;margin:14px 0 4px;border:0;border-radius:12px;padding:12px;font-size:15px;cursor:pointer;background:var(--ink);color:#fff}
.ef .paste{width:100%;box-sizing:border-box;border:1px solid #ddd;border-radius:10px;padding:10px;font-size:15px;font-family:inherit;min-height:110px;resize:vertical}
.ef .split{margin-top:6px;border:0;border-radius:10px;padding:10px;width:100%;cursor:pointer;font-size:14px;background:#5b7fd6;color:#fff}
.ef .hint{font-size:12.5px;color:var(--ink-soft);margin:4px 0 0}
.ef .tabs{display:flex;gap:6px;background:#f4f1ec;border-radius:12px;padding:4px;margin:12px 0 4px}
.ef .tabs button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px;font-size:14px;cursor:pointer}
.ef .tabs button.on{background:#fff;box-shadow:0 1px 3px #0002;font-weight:600}
.ef h3{margin-top:14px}
.ef .row{display:grid;grid-template-columns:1fr auto;gap:6px;background:#f4f1ec;border-radius:12px;padding:8px;margin-bottom:8px}
.ef .row textarea{grid-column:1/-1;width:100%;box-sizing:border-box;border:1px solid #ddd;border-radius:8px;padding:8px;font-size:15px;font-family:inherit;resize:vertical;min-height:40px}
.ef .row textarea.rn{grid-column:1/-1;width:100%;box-sizing:border-box;border:1px dashed #c9c2b5;border-radius:8px;padding:7px 8px;font-size:14px;font-family:inherit;resize:vertical;min-height:34px;background:#fffdf8}
.ef .row .sels{display:flex;gap:6px;flex-wrap:wrap}
.ef select{border:1px solid #ddd;border-radius:8px;padding:6px;font-size:14px;background:#fff;max-width:100%}
.ef .del{border:0;background:transparent;font-size:18px;cursor:pointer;color:#a33}
.ef .add,.ef .ci{border:1px dashed #bbb;background:#fff;border-radius:10px;padding:9px;width:100%;cursor:pointer;font-size:14px}
.ef .ci{border-style:solid;background:#e8f6ee;border-color:#9bd3b0}
.ef .acts{display:flex;gap:8px;margin-top:14px}.ef .acts button{flex:1;border:0;border-radius:10px;padding:11px;font-size:15px;cursor:pointer;background:#eee}
.ef .acts .pri{background:var(--ink);color:#fff}.ef .msg{color:#c0392b;font-size:13px;margin-top:8px}
.ef .rm{margin-top:10px;border:0;background:transparent;color:#a33;cursor:pointer;font-size:13px;text-decoration:underline}
.srcstaff{display:inline-block;font-size:11px;background:#e8f6ee;color:#1d7a46;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.admbtn{border:0;background:var(--paper);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13.5px;box-shadow:0 2px 0 #0002;margin-left:8px}
.admbtn.on{background:var(--ink);color:#fff}
.admwrap{position:fixed;inset:0;background:#0006;display:grid;place-items:center;z-index:500}
.admbox{background:#fff;border-radius:16px;padding:20px;width:min(340px,90vw);box-shadow:0 10px 30px #0003;font-size:14px}
.admbox h3{margin:0 0 6px}.admbox p{margin:0 0 12px;color:#666;line-height:1.4}
.admbox input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:10px;margin-bottom:8px;font-size:15px}
.admbox .row{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.admbox button{border:0;border-radius:10px;padding:9px 14px;cursor:pointer;font-size:14px;background:#eee}
.admbox button.pri{background:var(--ink);color:#fff}
.langsw{display:flex;background:var(--paper);border-radius:999px;padding:3px;box-shadow:0 2px 0 #0002;margin-left:auto}
.langsw button{border:0;background:transparent;border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13.5px}
.langsw button.on{background:var(--ink);color:#fff}
body.staff .alerts,body.staff #summary,body.staff .plaque .cnt,body.staff .chip.alert,body.staff .nameplate .q,body.staff .ownerlink{display:none!important}
html[lang=th] .kname,html[lang=th] .walker .tag em{display:none}
html[lang=th] body{font-family:"Sarabun",var(--body)}
.datenav{display:flex;align-items:center;gap:6px;background:var(--paper);border-radius:999px;padding:4px;box-shadow:0 2px 0 #0002}
.datenav button{border:0;background:transparent;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:16px}
.datenav button:hover:not(:disabled){background:#0000000d}
.datenav button:disabled{opacity:.3;cursor:default}
.datenav .d{font-family:var(--display);font-size:18px;min-width:132px;text-align:center}
.summary{display:flex;flex-wrap:wrap;gap:8px;padding:0 clamp(16px,3vw,32px) 12px}
.chip{background:var(--paper);border-radius:12px;padding:6px 12px;box-shadow:0 2px 0 #0002;font-size:14px;display:flex;gap:6px;align-items:baseline}
.chip b{font-family:var(--display);font-weight:400;font-size:19px;font-variant-numeric:tabular-nums}
.chip.alert{background:#fff1e6;border:1.5px solid #f3b27a}
.events{display:flex;gap:8px;overflow-x:auto;padding:0 clamp(16px,3vw,32px) 12px;align-items:stretch;scrollbar-width:thin}
.events .ttl{flex:none;align-self:center;font-size:13px;color:var(--ink-soft);margin-right:2px}
.ev{flex:none;background:var(--paper);border-radius:12px;padding:7px 12px;box-shadow:0 2px 0 #0002;font-size:13.5px;display:flex;gap:8px;align-items:center;border:0;text-align:left;font-family:inherit;color:inherit}
.ev .dd{font-weight:700;font-size:12px;border-radius:8px;padding:2px 7px;background:#eef3f2;color:var(--ink)}
.ev.today .dd{background:#ff7a45;color:#fff}.ev.soon .dd{background:#ffe1cc;color:#8a3d12}
.ev .dt{color:var(--ink-soft);font-size:12.5px}
.ev.add{border:1px dashed #bbb;background:transparent;box-shadow:none;cursor:pointer}
.ev.adm{cursor:pointer}
.events:empty{display:none}
.alerts{display:flex;flex-direction:column;gap:6px;padding:0 clamp(16px,3vw,32px) 12px}
.alerts .row{background:#fff6ec;border-left:5px solid var(--s-moved);border-radius:10px;padding:7px 12px;font-size:14px;cursor:pointer;text-align:left;border-top:0;border-right:0;border-bottom:0}
.alerts .row.info{border-left-color:#3f9b6a;background:#eef8f2}
.alerts .row.blocked{border-left-color:var(--s-blocked);background:#fff0ef}
.alerts .row:hover{filter:brightness(.98)}

/* ---------- office ---------- */
.office{position:relative;margin:0 clamp(8px,2vw,24px) 24px;border-radius:26px;overflow:hidden;box-shadow:0 6px 0 #0000001f}
.wallstrip{position:relative;height:118px;background:linear-gradient(var(--wall-deep),var(--wall-deep)) bottom/100% 12px no-repeat, #d7efe9;display:flex;align-items:flex-end;gap:28px;padding:0 28px 12px;overflow:hidden}
.window{width:220px;height:84px;border-radius:10px;background:linear-gradient(var(--skyTop),var(--skyBot));transition:background 1s;border:6px solid #fff;position:relative;flex:none;overflow:hidden}
.window::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 48%,#fff 48% 52%,transparent 52%)}
.window svg{position:absolute;bottom:0;left:0;width:100%}
.cloud{animation:drift 28s linear infinite}
@keyframes drift{from{transform:translateX(-60px)}to{transform:translateX(170px)}}
/* time of day */
body{--skyTop:#7cc7ff;--skyBot:#dff2ff}
body[data-sky=dawn]{--skyTop:#ffa47a;--skyBot:#ffe3b3}
body[data-sky=sunset]{--skyTop:#ff7e6b;--skyBot:#ffc58a}
body[data-sky=night]{--skyTop:#18203f;--skyBot:#3a3f70}
.window .stars,.window .moon,.window .lights{display:none}
body[data-sky=night] .window .stars,body[data-sky=night] .window .moon,body[data-sky=night] .window .lights,body[data-sky=sunset] .window .lights{display:inline}
body[data-sky=night] .window .sun,body[data-sky=night] .window .cloud{display:none}
body[data-sky=dawn] .window .sun{transform:translateY(34px)}
body[data-sky=sunset] .window .sun{transform:translateY(30px);fill:#ff9a3c}
body[data-sky=night] .window .city{fill:#2b3157}
.window .sun{transition:transform 1s}
.office{transition:filter 1s}
.room,.annex>div,.desk svg{transition:background-color 1s, filter 1s}
body[data-sky=dawn] .room{background-color:#fdeee0 !important}
body[data-sky=sunset] .room{background-color:#fbe1cf !important}
body[data-sky=sunset] .desk svg{filter:sepia(.2) saturate(1.1)}
body[data-sky=night] .room,body[data-sky=night] .annex>div{background-color:#c3c6dc !important}
body[data-sky=night] .desk svg{filter:brightness(.78) saturate(.9)}
body[data-sky=night] .floor{background:#2c2a3a}
body[data-sky=night] .wallstrip{background-color:#9fb8b4}
.stars circle{animation:glow 2.2s infinite}.stars circle:nth-child(2n){animation-delay:1s}
.sign{background:#f47a1a;color:#fff;font-family:var(--display);padding:8px 16px;border-radius:12px;font-size:20px;align-self:center;box-shadow:0 3px 0 #0004;flex:none}
.sign .wm{color:#fff}
.board{position:relative;flex:1 1 auto;min-width:0;max-width:760px;align-self:center;height:92px;margin-bottom:2px;background:#c89a64 radial-gradient(#b5854f 1px,transparent 1.4px) 0 0/7px 7px;border:6px solid #8a5a34;border-radius:8px;box-shadow:0 3px 0 #0003, inset 0 0 0 1px #0002;display:flex;align-items:center;padding:0 10px 0 8px;gap:8px}
.board .b-title{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--display);font-size:13px;color:#fff;background:#8a5a34;border-radius:4px;padding:6px 3px;flex:none}
.board .b-notes{display:flex;gap:10px;align-items:center;overflow:hidden;flex:1;min-width:0;padding:6px 2px}
.board .note{position:relative;flex:0 0 152px;height:66px;border:0;text-align:left;font-family:inherit;color:#2b2833;padding:9px 9px 6px;border-radius:2px;box-shadow:0 3px 4px #0003;transform:rotate(var(--r));cursor:pointer;display:flex;flex-direction:column;gap:2px;overflow:hidden;transition:transform .15s}
.board .note:hover{transform:rotate(0) translateY(-2px) scale(1.03)}
.board .note .pin{position:absolute;top:3px;left:50%;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;background:#e74c3c;box-shadow:0 1px 0 #0004}
.board .note b{font-size:11.5px;font-weight:700;display:flex;gap:5px;align-items:center;white-space:nowrap}
.board .note .t{font-size:12.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.board .n-notice{background:#fff3a6}
.board .n-event{background:#fff}
.board .n-event .dd{border-radius:6px;padding:0 5px;background:#eef3f2}
.board .n-event.soon .dd{background:#ffe1cc;color:#8a3d12}.board .n-event.today .dd{background:#ff7a45;color:#fff}
.board .n-event.today{background:#fff4ec}
.board .n-more{flex:0 0 64px;min-width:64px;background:#d8f0e6;align-items:center;justify-content:center;font-weight:700;font-size:16px;text-align:center}
.board .n-more small{font-weight:400;font-size:11px}
.board .b-empty{color:#fff;font-size:13px;opacity:.9}
.board .b-add{position:absolute;right:-10px;top:-10px;width:26px;height:26px;border-radius:50%;border:0;background:#2b2833;color:#fff;font-size:16px;cursor:pointer;box-shadow:0 2px 0 #0003}
.admbox.wide{width:min(460px,92vw);max-height:80vh;overflow:auto}
.bl-h{font-weight:700;margin:12px 0 6px;font-size:13.5px}
.bl-row{display:flex;gap:10px;align-items:flex-start;padding:8px;border-radius:10px;background:#f7f4ef;margin-bottom:6px}
.bl-row.ed{cursor:pointer}.bl-row.ed:hover{background:#efe9df}
.bl-tag{flex:none;font-size:12px;font-weight:700;border-radius:7px;padding:2px 7px;background:#eef3f2}
.bl-tag.n{background:#fff3a6}.bl-tag.soon{background:#ffe1cc;color:#8a3d12}.bl-tag.today{background:#ff7a45;color:#fff}
.bl-t{font-size:14px;line-height:1.4;white-space:pre-wrap}.bl-d{font-size:12px;color:var(--ink-soft)}
.bl-edit{margin-left:auto}
@media (max-width:820px){.wallstrip{height:auto;flex-wrap:wrap;padding-top:10px;gap:14px}.board{order:9;flex-basis:100%;max-width:none}}
.wallclock{width:62px;height:62px;flex:none;align-self:center}
.workstate{align-self:center;background:#fff;border-radius:12px;padding:6px 12px;box-shadow:0 2px 0 #0002;font-size:13px;line-height:1.35}
.workstate b{font-family:var(--display);font-weight:400;font-size:17px;display:block}
.plant{width:54px;flex:none;margin-left:auto}
.plant .leaf{transform-origin:27px 60px;animation:sway 5s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(3deg)}}
/* floor plan: walls are thick dark lines, rooms tiled */
.floor{--wl:#4d4a57;background:var(--wl);display:grid;gap:7px;padding:7px;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:860px){.floor{grid-template-columns:minmax(0,1fr)}}
.room,.annex>div{background-color:#f1eee8;background-image:linear-gradient(#e4dfd6 1px,transparent 1px),linear-gradient(90deg,#e4dfd6 1px,transparent 1px);background-size:44px 44px}
.room{padding:62px 12px 22px;position:relative}
.room[data-team=production]{background-color:#eef2fb}
.room[data-team=management]{background-color:#fbf1f4}
.plaque{position:absolute;top:14px;left:50%;transform:translateX(-50%);text-align:center;white-space:nowrap}
.plaque b{font-family:var(--display);font-weight:400;font-size:19px}
.plaque small{display:block;color:var(--ink-soft);font-size:11px;letter-spacing:1.2px}
.mgmt{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
.side{display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:4px}
.shelf{width:30px;height:96px;border-radius:4px;background:repeating-linear-gradient(#b27c4c 0 30px,#8f5f37 30px 32px)}
.printer{width:46px;height:34px;border-radius:6px;background:#c9cfd8;position:relative}
.printer::after{content:"";position:absolute;right:6px;top:8px;width:6px;height:6px;border-radius:50%;background:#45d483;animation:glow 1.6s infinite}
.pods{display:grid;grid-template-columns:repeat(2,minmax(140px,1fr));gap:22px 12px}
.pod{position:relative;display:flex;flex-direction:column;gap:18px;padding:4px 0 10px;border-radius:22px;background:#c48d5b14;border:2px dashed #c48d5b55}
.annex{display:grid;grid-column:1/-1;grid-template-columns:1fr 1.6fr 1fr;gap:7px}
.annex>div{min-height:150px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 8px}
.annex .lbl{font-size:12px;color:var(--ink-soft);margin-top:4px}
.dr{background-color:#fff7e3 !important}
.srv{background:none;border:0;padding:0;cursor:pointer;font:inherit;color:inherit;display:flex;flex-direction:column;align-items:center}
.srvst{font-size:11px;font-weight:700;margin-top:4px;white-space:nowrap;background:#fff;color:var(--ink);border-radius:10px;padding:2px 9px}.srv.off .srvst{background:#6b6880;color:#e9e7f3}.srvby{font-size:10px;color:#d6d3e6;white-space:nowrap;margin-top:2px}
.srv.off .rack i::after{background:#3a3846!important;animation:none}
.srv.off .rack{opacity:.75}
.srv:hover .rack{outline:2px solid #ffc531;outline-offset:2px}
.rack{width:44px;height:64px;border-radius:5px;background:#3b3846;display:flex;flex-direction:column;gap:5px;padding:7px 6px}
.rack i{height:8px;border-radius:2px;background:#58556a;position:relative}
.rack i::after{content:"";position:absolute;right:3px;top:2px;width:4px;height:4px;border-radius:50%;background:#45d483;animation:glow 1.1s infinite}
.rack i:nth-child(2)::after{animation-delay:.4s;background:#ffc531}.rack i:nth-child(3)::after{animation-delay:.8s}
.equip-room{background-color:#eef3f8 !important}
.equip{display:flex;flex-direction:column;align-items:center;text-decoration:none;color:inherit;border-radius:14px;padding:6px 10px;transition:transform .15s}
.equip:hover{transform:translateY(-3px)}
.equip-art{width:120px;height:78px;display:block}
.equip-art .beam{animation:glow 2.4s ease-in-out infinite}
.equip-go{margin-top:4px;font-size:12.5px;background:var(--ink);color:#fff;border-radius:999px;padding:4px 11px;box-shadow:0 2px 0 #0003}
.wm{display:inline-block;vertical-align:baseline;line-height:0}.wm svg{height:.72em;width:auto;display:block;overflow:visible}
.brand-logo{width:48px;height:48px;border-radius:50%;flex:none;box-shadow:0 3px 0 #0002}
.sign .wm svg{height:15px}
.brand h1 .wm{margin-right:.12em}
.door{font-family:var(--display);font-size:16px;color:var(--ink-soft)}
.seat{font-size:10px;color:#fff;background:#4d4a57;border-radius:5px;padding:0 4px;margin-right:2px}
.kname{font-family:var(--body);font-size:12px;color:var(--ink-soft)}
.empty-seat{opacity:.55;cursor:default}
.desk.trip svg{opacity:.75}
.empty-seat:hover{transform:none}
@media (max-width:420px){.mgmt{grid-template-columns:1fr}.side{flex-direction:row;justify-content:center}.shelf{width:96px;height:24px;background:repeating-linear-gradient(90deg,#b27c4c 0 30px,#8f5f37 30px 32px)}.annex{grid-template-columns:1fr}}

/* ---------- desk ---------- */
.desk.blocked{background:radial-gradient(ellipse at 50% 70%,#ff5a4a33 0%,#ff5a4a14 45%,transparent 70%);animation:helpGlow 1.6s ease-in-out infinite}
@keyframes helpGlow{0%,100%{box-shadow:0 0 0 0 #ff5a4a00}50%{box-shadow:0 0 0 6px #ff5a4a40}}
.helpsign{position:absolute;right:-6px;top:44px;z-index:6;background:#ff5a4a;color:#fff;font-weight:700;font-size:12.5px;border-radius:12px;padding:4px 9px 4px 6px;box-shadow:0 3px 0 #b8322633;white-space:nowrap;transform-origin:bottom left;animation:helpWave 1.2s ease-in-out infinite}
.helpsign .hand{display:inline-block;font-size:17px;vertical-align:-2px;margin-right:2px;transform-origin:70% 90%;animation:handWave .6s ease-in-out infinite alternate}
@keyframes helpWave{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes handWave{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
@media (prefers-reduced-motion:reduce){.desk.blocked,.helpsign,.helpsign .hand{animation:none}}
.desk{position:relative;border:0;background:transparent;padding:58px 0 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;border-radius:16px;transition:transform .15s}
.desk:hover{transform:translateY(-3px)}
.desk svg{width:140px;height:138px;display:block;overflow:visible}
.nameplate{margin-top:-6px;background:var(--paper);border-radius:8px;padding:1px 10px 2px;box-shadow:0 2px 0 #0002;display:flex;gap:5px;align-items:center;font-family:var(--display);font-size:16px;white-space:nowrap}
.nameplate .q{font-family:var(--body);font-size:11px;background:#ffe2b8;color:#8a5200;border-radius:6px;padding:0 5px}
.role{font-size:11.5px;color:var(--ink-soft);margin-top:3px;max-width:140px;text-align:center;line-height:1.3}
.bubble{position:absolute;top:0;left:50%;transform:translateX(-50%);width:150px;min-height:48px;background:#fff;border-radius:14px;padding:6px 9px 7px;font-size:12.5px;line-height:1.35;box-shadow:0 2px 0 #0002;text-align:left;z-index:2;transition:opacity .35s}

.runner{animation:runb .3s ease-in-out infinite alternate}

.stroller{animation:runb .6s ease-in-out infinite alternate}

    state==="done" ? `<path class="sparkle" d="M0,0 l2,5 5,2 -5,2 -2,5 -2,-5 -5,-2 5,-2z" fill="#ffc531"/>` :
    state==="blocked" ? `<path class="sweat" d="M0,0 q3,5 0,7 q-3,-2 0,-7z" fill="#7cc6ff"/>` : "";
  if (!withDesk){
    const s = sp.sit || sp.leave; const w = s.w, h = s.h * 0.52;
    return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMin meet" aria-hidden="true"><image href="${s.src}" width="${s.w}" height="${s.h}"/></svg>`;
  }
  if ((mode==="run" || mode==="leave") && sp[mode]){
    const s = sp[mode], H = 112, W = s.w*H/s.h, cx = mode==="run" ? 40 : 102;
    return `<svg viewBox="0 0 140 138" aria-hidden="true">${deskImg(sp._desk)}
      <g class="${mode==='run'?'runner':'stroller'}"><image href="${s.src}" x="${cx-W/2}" y="${137-H}" width="${W}" height="${H}"/></g></svg>`;
  }
  const wk = sp.work, s = wk ? wk.frames.sit : sp.sit, H = 132, W = s.w*H/s.h, top = DESK_LINE - H*(wk ? wk.hy : 0.6);
  const idleSet = !!(wk && wk.idle && state==="idle");   // 아직 업무 입력 전: 하품·갸웃 동작
  const cid = "clip" + (++_clipN);
  return `<svg viewBox="0 0 140 138" aria-hidden="true"><defs><clipPath id="${cid}"><rect x="0" y="-40" width="140" height="${118+40}"/></clipPath></defs>
    <g clip-path="url(#${cid})"><g class="bob"><image ${wk?`class="anim" ${idleSet?'data-idle="1"':''} data-frames='${esc(JSON.stringify(idleSet ? {sit:wk.frames.sit.src, yawn:wk.idle.yawn.src, puzzle:wk.idle.puzzle.src} : Object.fromEntries(Object.entries(wk.frames).map(([k,v])=>[k,v.src]))))}'`:""} href="${s.src}" x="${70-W/2}" y="${top}" width="${W}" height="${H}"/></g></g>
    ${deskImg(sp._desk)}
    ${extras?`<g transform="translate(${70+W/2-4},${top+6})">${extras}</g>`:""}</svg>`;
}
function avatar(st, state, withDesk=true, mode="desk"){
  const sp0 = spriteOf(st.id);
  if (sp0 && sp0.sit) return spriteAvatar(Object.assign({_desk: deskTypeOf(st.id)}, sp0), state, withDesk, mode);
  const photo = imgOf(st.id);
  if (!photo && (!window.AV || !baseP(st.id))) return avatarDrawn(st, state==="idle"?"working":state, withDesk);
  const L = photo ? null : lookP(st.id), uri = photo || avatarURI(L, state), skin = photo ? "#f1c6a3" : "#"+L.skinColor;
  const extras =
    state==="done" ? `<path class="sparkle" d="M28,-40 l2,5 5,2 -5,2 -2,5 -2,-5 -5,-2 5,-2z" fill="#ffc531"/>` :
    state==="blocked" ? `<path class="sweat" d="M24,-30 q3,5 0,7 q-3,-2 0,-7z" fill="#7cc6ff"/>` : "";
  const person = `<g class="bob"><image href="${uri}" x="-44" y="-58" width="88" height="88"/>${extras}</g>`;
  if (!withDesk) return `<svg viewBox="-44 -58 88 88" aria-hidden="true">${person}</svg>`;
  if (mode==="run" || mode==="leave"){
    const d = deskParts(false);
    const x = mode==="run" ? 46 : 96;
    return `<svg viewBox="0 0 140 118" aria-hidden="true">${d.back}${d.front}<g transform="translate(${x},101)">${walker(uri, mode)}</g></svg>`;
  }
  const d = deskParts(true);
  return `<svg viewBox="0 0 140 118" aria-hidden="true">${d.back}
    <g transform="translate(60,54)">${person}</g>
    ${photo?"":`<circle class="handL" cx="49" cy="82" r="4.5" fill="${skin}"/><circle class="handR" cx="71" cy="82" r="4.5" fill="${skin}"/>`}
    ${d.front}</svg>`;
}

/* ---------- data helpers ---------- */
function absence(id, date){
  return (D.absences||[]).find(a=>{
    if (a.id!==id || date<a.from || date>a.to) return false;
    if (a.half && date===D.current){ const m=nowMin(); return a.half==="am" ? m < 13*60+30 : m >= 12*60+30; }  // 오전 반차: 13:30까지, 오후 반차: 점심(12:30)부터
    return true;
  });
}
const showBack = a => a.type==="trip" || a.to > a.from;   // 하루짜리 연차·반차는 복귀일을 말하지 않음
const md = s => { const d=parse(s); return `${d.getUTCMonth()+1}/${d.getUTCDate()}`; };
function report(id, date){ return (D.days[date]||{})[id]; }
function weekGoals(id, date){ return (D.weeks[monday(date)]||{})[id]; }
function lastWeek(id, date){ return (D.weeks[addDays(monday(date),-7)]||{})[id]; }
function stateOf(r){
  if (!r || !r.tasks || !r.tasks.length) return "away";
  const s = r.tasks.map(t=>t.s);
  if (s.includes("blocked")) return "blocked";
  if (s.every(x=>x==="done"||x==="final")) return "done";
  return "working";
}
function nowBKK(){ return new Date(Date.now() + 7*3600e3); }
function phaseOf(date){
  if (date < D.current) return "past";
  if (date > D.current) return "future";
  const n = nowBKK(), wd = n.getUTCDay();
  if (wd===0 || wd===6) return "weekend";
  const toMin = t => { const [a,b]=t.split(":").map(Number); return a*60+b; };
  const cur = n.getUTCHours()*60 + n.getUTCMinutes();
  return cur < toMin(D.hours.start) ? "before" : cur < toMin(D.hours.end) ? "work" : "after";
}

/* 퇴근 모드: 17:30이 지나도, 퇴근 무렵(16:30 이후)에 자기 업무를 업데이트한 사람만 퇴근. 시간으로 자동 퇴근시키지 않음(야근) */
const UPD_FROM = 16*60+30;
function nowMin(){ const n=nowBKK(); return n.getUTCHours()*60+n.getUTCMinutes(); }
function updMin(id, date){
  const d = STAFF_DOCS[date+"_"+id]; if(!d || !d.at) return null;
  const ms = typeof d.at.toMillis==="function" ? d.at.toMillis() : (d.at.seconds ? d.at.seconds*1000 : null); if(ms==null) return null;
  const t = new Date(ms + 7*3600e3); if (fmt(t)!==date) return null;
  return t.getUTCHours()*60 + t.getUTCMinutes();
}
/* 출근 전이라도 오늘 업무를 이미 입력했으면 자리에 있는 것으로 */
function arrivedAt(id, date){
  const c = ((D.checkin||{})[date]||{})[id]; if (c) return c;
  const d = STAFF_DOCS[date+"_"+id];
  if (d && Array.isArray(d.tasks) && d.tasks.length){ const u = updMin(id, date); return u!=null ? `${String(Math.floor(u/60)).padStart(2,"0")}:${String(u%60).padStart(2,"0")}` : "✓"; }
  const r = report(id, date); if (r && r.tasks && r.tasks.length) return "✓";
  return null;
}
/* 퇴근 버튼으로 기록한 퇴근 시각(분). 자정 넘어 퇴근하면 24:30처럼 24시 이상으로 저장 */
function checkoutMin(id, date){ const d=STAFF_DOCS[date+"_"+id]; if(!d || !d.checkout) return null; const [h,m]=d.checkout.split(":").map(Number); return h*60+m; }
function isWkend(date){ const g=parse(date).getUTCDay(); return g===0||g===6; }
function prevWorkday(date){ let d=addDays(date,-1); while(isWkend(d)) d=addDays(d,-1); return d; }
/* 야근 규정: 21:30 이후 퇴근 → 10:30 출근 또는 15:30 퇴근 / 22:30 → 11:30·14:30 / 23:30 → 13:30·12:30 */
function otOf(id, date){
  const p = prevWorkday(date), m = checkoutMin(id, p) ?? updMin(id, p);
  const pick = STAFF_DOCS[p+"_"+id]?.ot || null;          // "late" = 늦게 출근, "early" = 일찍 퇴근
  const o = otRule(m); return o ? {...o, pick} : null;
}
function otRule(m){
  if (m==null) return null;
  if (m >= 23*60+30) return {in:"13:30", out:"12:30"};
  if (m >= 22*60+30) return {in:"11:30", out:"14:30"};
  if (m >= 21*60+30) return {in:"10:30", out:"15:30"};
  return null;
}
const hm2m = t => { const [h,m]=t.split(":").map(Number); return h*60+m; };
function lateStart(id, date){ if (date!==D.current) return null; const o=otOf(id,date); if(!o || o.pick==="early") return null; return (nowMin() < hm2m(o.in) && !report(id,date)?.tasks?.length) ? o : null; }
function personPhase(id, date){
  const ph=phaseOf(date);
  const co = checkoutMin(id, date);
  if (co!=null && (ph==="work" || ph==="after") && (date!==D.current || nowMin() >= co || co >= 24*60)) return "after";
  return ph==="after" ? "work" : ph;   // 퇴근 버튼을 누른 사람만 퇴근 모드 (야근하는 사람은 계속 자리에)
}

/* 예배·점심 시간 */
const BRK = {
  worship:{icon:"🙏", ko:"아침 예배", th:"นมัสการเช้า", bub_ko:"🙏 예배 중", bub_th:"🙏 นมัสการอยู่"},
  lunch:  {icon:"🍚", ko:"점심시간", th:"พักกลางวัน", bub_ko:"🍚 점심 식사 중", bub_th:"🍚 พักทานข้าว"},
};
function breakOf(date){
  if (!D || date!==D.current || phaseOf(date)!=="work") return null;
  const m = nowMin();
  const b = (D.hours.breaks||[]).find(x=>{ const [a1,a2]=x.from.split(":").map(Number), [b1,b2]=x.to.split(":").map(Number); return m>=a1*60+a2 && m<b1*60+b2; });
  return b ? {...b, ...(BRK[b.id]||{icon:"⏸",ko:b.id,th:b.id,bub_ko:b.id,bub_th:b.id})} : null;
}
let lastBreak = null;
let lastGone = -1;
let lastPhase = null;
let lastWk;
function weekBlocked(id, date){ return (weekGoals(id,date)||[]).filter(t=>t.s==="blocked").map(t=>({...t, ko:"[주간] "+(t.ko||t.th), th:"[สัปดาห์] "+(t.th||t.ko), n:t.n, nth:t.nth})); }
function needsHelp(id, date){ const r=report(id,date); return !!(r?.tasks?.some(t=>t.s==="blocked") || weekBlocked(id,date).length); }
function bubbleOrder(r){
  const rank = {blocked:0, doing:1, plan:2, moved:3, done:4, final:4};
  return [...r.tasks].sort((a,b)=>(rank[a.s]??5)-(rank[b.s]??5));
}

/* ---------- render ---------- */
function render(){
  const date = dates[idx];
  document.getElementById("dateLabel").textContent = label(date) + (date===D.current?T(" · 오늘"," · วันนี้"):"");
  document.getElementById("prev").disabled = idx===0;
  document.getElementById("next").disabled = idx===dates.length-1;

  // summary
  let reported=0, total=0, done=0, blocked=0;
  const away = D.staff.filter(st=>absence(st.id,date)).length;
  D.staff.forEach(st=>{ const r=report(st.id,date); if(r&&r.tasks?.length){reported++; r.tasks.forEach(t=>{total++; if(t.s==="done"||t.s==="final")done++; if(t.s==="blocked")blocked++;});} });
  const alerts=[];
  D.staff.forEach(st=>{
    (lastWeek(st.id,date)||[]).forEach(t=>{ if(t.s==="moved"||t.s==="blocked") alerts.push({st,t,why:"지난주 "+STATUS[t.s].ko}); });
    (report(st.id,date)?.tasks||[]).forEach(t=>{ if(t.s==="blocked") alerts.push({st,t,why:"도움 필요"}); if(t.s==="moved") alerts.push({st,t,why:"미완·이월"}); });
    const dco = STAFF_DOCS[date+"_"+st.id];
    if (dco?.early) alerts.push({st, t:{ko: dco.early, s:"early"}, why:`⏰ 조기 퇴근 ${dco.checkout||""}`});
  });
  document.getElementById("summary").innerHTML = `
    <div class="chip">${T("보고","ส่งรายงาน")} <b>${reported}</b> / ${D.staff.length-away}${T("명"," คน")}</div>
    ${away?`<div class="chip">${T("출장·휴가","ไม่อยู่ออฟฟิศ")} <b>${away}</b>${T("명"," คน")}</div>`:""}
    ${(D.checkin||{})[date]?`<div class="chip">${T("출근","เข้างานแล้ว")} <b>${Object.keys(D.checkin[date]).length}</b> / ${D.staff.length-away}${T("명"," คน")}</div>`:""}
    ${date<D.current && D.staff.length-away-reported>0?`<div class="chip alert">미제출 <b>${D.staff.length-away-reported}</b>명</div>`:""}
    <div class="chip">${T("할 일","งานทั้งหมด")} <b>${total}</b>${T("개","")}</div>
    <div class="chip">${T("완료","เสร็จแล้ว")} <b>${done}</b></div>
    <div class="chip">${T("도움 필요","ต้องการความช่วยเหลือ")} <b>${blocked}</b></div>
    ${alerts.length?`<div class="chip alert">살펴볼 일 <b>${alerts.length}</b></div>`:""}`;
  const soon = (D.absences||[]).filter(a=>a.from>date && a.from<=addDays(date,7));
  document.getElementById("alerts").innerHTML = soon.map(a=>{const st=D.staff.find(s=>s.id===a.id);
    return `<button class="row info" data-id="${a.id}">${a.type==="trip"?"✈️":"🌴"} <b>${esc(st?.name||a.id)}</b> · ${a.from===a.to?md(a.from):md(a.from)+"–"+md(a.to)} ${esc(absKo(a))}${T(" 예정","")}${absWhere(a)?` (${esc(absWhere(a))})`:""}</button>`;}).join("") + alerts.map((a,i)=>`
    <button class="row ${a.t.s==='blocked'?'blocked':''}" data-id="${a.st.id}"><b>${esc(a.st.name)}</b> · ${esc(a.why)} — ${esc(a.t.ko)}</button>`).join("");

  renderStreet(date);
  // floor (follows the real seating plan)
  const floor = document.getElementById("floor");
  const seatHTML = code => {
    const st = D.staff.find(s=>s.seat===code);
    if (!st) return `<div class="desk empty-seat" aria-label="${code} 빈자리">
      <div style="height:0"></div>${emptyDesk()}
      <div class="nameplate">${T("빈자리","ที่ว่าง")}</div><div class="role">&nbsp;</div></div>`;
    const ab = absence(st.id,date);
    if (ab) return `<button class="desk trip" data-id="${st.id}" aria-label="${esc(st.name)} ${esc(ab.ko)} 중">
      <div class="bubble idle"><div>${ab.type==="trip"?"✈️":"🌴"} ${esc(absKo(ab))}${showBack(ab)?`${T(" 중","")} · <b>${T(md(ab.back)+" 복귀","กลับ "+md(ab.back))}</b>`:""}</div>${absWhere(ab)?`<div style="font-size:11.5px">${esc(absWhere(ab))}</div>`:""}</div>
      ${emptyDesk(ab.type, deskTypeOf(st.id))}
      <div class="nameplate">${esc(st.name)} <span class="kname">${esc(st.kname||"")}</span></div></button>`;
    const r = report(st.id,date), ph = personPhase(st.id,date);
    let state = stateOf(r); if (state==="away") state = "idle"; if (weekBlocked(st.id,date).length) state = "blocked";

function renderBreak(el, date, brk){
  const people = D.staff.filter(st=>!absence(st.id,date) && st.sprite?.sit && !lateStart(st.id,date) && personPhase(st.id,date)!=="after");
  if ((brk.id==="worship" && dirStatus(date).status!=="leave") || dirStatus(date).status==="in" || (dirStatus(date).status==="custom" && !dirStatus(date).away)) people.push({id:"dr", name:D.director.name||T(D.director.label, D.director.label_th||D.director.label), sprite:D.director.sprite});
  el.hidden = false;
  const n = people.length;
  const rows = brk.id==="worship" ? 2 : 1;
  const per = Math.ceil(n/rows);
  const seats = people.map((st,i)=>{
    const sp = st.sprite.sit; const r = Math.floor(i/per), c = i%per;
    const x = brk.id==="worship" ? (10 + (c + 0.5 + (r===0?0.5:0))*80/(per+0.5)) : (6 + (i+0.5)*88/n);
    const bottom = brk.id==="worship" ? (r===0 ? 112 : 12) : 30;
    const z = 10 + r*10;
    return `<button class="sitter" data-id="${st.id}" aria-label="${esc(st.name)}" style="left:${x.toFixed(1)}%;bottom:${bottom}px;z-index:${z}">
      <img src="${sp.src}" alt=""><span class="tag">${esc(st.name)}</span></button>`;
  }).join("");

/* 근무시간 중 오가는 사람: 늦은 출근은 출근 1시간 전부터, 조기 퇴근은 퇴근 후 1시간 동안 길에 보임 */
function workCommuters(date){
  const r = {come:[], go:[], dir:false};
  if (date!==D.current || phaseOf(date)!=="work") return r;
  const now = nowMin();
  const ds = FEV.director_status;
  if (ds && ds.date===date && ds.status==="out" && ds.time){ const t=hm2m(ds.time); r.dir = now>=t && now<t+60; }
  D.staff.forEach(st=>{
    if (absence(st.id,date)) return;
    const o = lateStart(st.id,date);
    if (o && !arrivedAt(st.id,date) && now >= hm2m(o.in)-60) r.come.push(st);
    const co = checkoutMin(st.id,date);
    if (co!=null && now >= co && now < co+60) r.go.push(st);
  });
  return r;
}

function renderStreet(date){
  const el = document.getElementById("street");

  const ph = pv || phaseOf(date);
  const brk = pv ? null : breakOf(date);
  if (brk){ renderBreak(el, date, brk); return; }
  const wc = (!pv && ph==="work") ? workCommuters(date) : null;
  if (wc && !wc.come.length && !wc.go.length && !wc.dir){ el.hidden = true; el.innerHTML = ""; return; }
  if (!wc && !(ph==="before" || ph==="after")){ el.hidden = true; el.innerHTML = ""; return; }
  const goIds = new Set(wc ? wc.go.map(x=>x.id) : []);
  const checkin = (D.checkin||{})[date]||{};

  const dirCar = carSp && (wc ? wc.dir : pv ? true : ph==="before" ? dirCommuting(date) : (date===D.current && dirStatus(date).status==="out"));
  if (ph==="after" && !people.length && !dirCar){ el.hidden = true; el.innerHTML = ""; return; }
  const mode = ph==="before" ? "run" : "leave";
  el.hidden = false;
  const n = people.length + (dirCar?1:0);
  const title = wc
    ? (wc.come.length && (wc.go.length||dirCar) ? `<b>${T("🚶 오가는 길","🚶 ระหว่างทาง")}</b><small>${T(`${wc.come.length}명 출근 중 · ${wc.go.length+(dirCar?1:0)}명 먼저 퇴근`, `กำลังมา ${wc.come.length} คน · กลับก่อน ${wc.go.length+(dirCar?1:0)} คน`)}</small>`
      : wc.come.length ? `<b>${T("🚶 출근길","🚶 ระหว่างทางมาทำงาน")}</b><small>${T(`${wc.come.length}명이 회사로 오는 중`, `${wc.come.length} คนกำลังมาที่ออฟฟิศ`)}</small>`

    : ph==="before"
    ? `<b>${T("🚶 출근길","🚶 ระหว่างทางมาทำงาน")}</b><small>${n ? T(`${n}명이 회사로 오는 중 · 08:30 출근`, `${n} คนกำลังมาที่ออฟฟิศ · เข้างาน 08:30`) : T("모두 출근 완료!","ทุกคนมาถึงแล้ว!")}</small>`
    : `<b>${T("🌆 퇴근길","🌆 ทางกลับบ้าน")}</b><small>${T(`오늘도 수고했어요 · ${n}명 퇴근`, `วันนี้เหนื่อยแล้วนะครับ · เลิกงาน ${n} คน`)}</small>`;
  let wi=0, mi=0;
  const walkers = people.map((st,i)=>{
    const S = st.sprite||{};
    const moto = !!S.moto;
    const toLeft = wc ? goIds.has(st.id) : mode!=="run";
    const sp = S.moto || S.walk || S[toLeft?"leave":"run"]; if (!sp) return "";
    const flip = (S.moto||S.walk) ? toLeft : !!sp.flip;
    const k = moto ? mi++ : wi++;
    const dur = moto ? 11 + (k*5)%4 : (mode==="run" ? 30 : 34) + (k*7)%8;
    const delay = -(((k+0.4)*dur)/(moto?3:Math.max(n,1))).toFixed(1);
    const lane = moto ? 30 + (k%2)*4 : [70, 92, 80, 100][k%4];
    const cls = moto ? "moto" : (S.walk ? "stroll" : (mode==='leave'?'stroll':''));
    return `<button class="walker ${cls} ${flip?'flip':''}" data-id="${st.id}" aria-label="${esc(st.name)}"
      style="--x:${(4 + i*72/Math.max(n,1)).toFixed(1)}%;--lane:${lane}px;--anim:${toLeft?'goLeft':'goRight'};--dur:${dur}s;--delay:${delay}s;z-index:${moto?300-lane:200-lane}">
      <div class="body"><img src="${sp.src}" alt=""></div><span class="tag">${esc(st.name)}<em>${esc(st.kname||"")}</em></span></button>`;

  el.innerHTML = streetSVG() + `<div class="title">${title}</div>` + walkers + car;
  streetScale();
}

function nextWorkday(d){ let x=addDays(d,1); while(isWkend(x)) x=addDays(x,1); return x; }
function dirLeave(date){ return Object.entries(FEV).map(([k,e])=>({...e,_id:k})).find(e=>e.kind==="dirleave" && date>=e.from && date<=(e.to||e.from)); }
function dirCommuting(date){
  if (date!==D.current || phaseOf(date)!=="before" || dirLeave(date)) return false;
  const s = FEV.director_status; return !s || s.date!==D.current;
}
function dirStatus(date){
  const lv = dirLeave(date); if (lv) return {status:"leave", leave:lv};
  if (date!==D.current) return {status:"in"};
  const s = FEV.director_status; if (!s || s.date!==D.current) return {status:"in"};

}

/* busy-at-desk animation: typing (2 frames) with occasional coffee / phone / thinking */
const _animState = new WeakMap(), _preloaded = new Set();
function animTick(){
  const now = performance.now();
  document.querySelectorAll("image.anim").forEach(el=>{
    let st = _animState.get(el);
    if (!st){
      let f = {}; try { f = JSON.parse(el.dataset.frames); } catch(e){ return; }
      Object.values(f).forEach(src=>{ if(!_preloaded.has(src)){ const i=new Image(); i.src=src; _preloaded.add(src);} });
      const idle = el.dataset.idle==="1";
      st = {f, idle, mode: idle ? "sit" : "type", until: now + (idle ? 1500 + Math.random()*3500 : 3000 + Math.random()*5000), flip:false, last:0};
      _animState.set(el, st);
    }
    if (st.idle){
      if (now > st.until){
        if (st.mode==="sit"){ st.mode = Math.random()<0.5 ? "yawn" : "puzzle"; st.until = now + 2200 + Math.random()*1800; }
        else { st.mode = "sit"; st.until = now + 3000 + Math.random()*4000; }
      }
      const isrc = st.f[st.mode] || st.f.sit; if (el.getAttribute("href") !== isrc) el.setAttribute("href", isrc); return;
    }
    if (now > st.until){
      if (st.mode==="type"){
        const acts = Object.keys(st.f).filter(k=>k!=="sit" && k!=="type");
        st.mode = acts[Math.floor(Math.random()*acts.length)] || "type";
        st.until = now + 2500 + Math.random()*2000;
      } else { st.mode = "type"; st.until = now + 5000 + Math.random()*6000; }
    }
    let src;
    if (st.mode==="type"){
      if (now - st.last > 280){ st.flip = !st.flip; st.last = now; }
      src = st.flip ? (st.f.type||st.f.sit) : st.f.sit;
    } else src = st.f[st.mode];
    if (el.getAttribute("href") !== src) el.setAttribute("href", src);
  });
}

function tickClock(){
  const now = new Date(Date.now() + 7*3600e3); // Bangkok
  const h = now.getUTCHours()%12, m = now.getUTCMinutes();
  document.getElementById("hh").setAttribute("transform",`rotate(${h*30+m/2} 31 31)`);
  document.getElementById("mh").setAttribute("transform",`rotate(${m*6} 31 31)`);
  if (!D || !D.hours) return;
  const ph = phaseOf(D.current);
  const hm = n2 => n2.getUTCHours()*60+n2.getUTCMinutes();
  const cm = hm(now);
  const live = dates[idx]===D.current;
  document.body.dataset.sky = !live ? "day" : cm < 6*60 ? "night" : cm < 8*60+30 ? "dawn" : cm < 17*60+30 ? "day" : cm < 18*60+30 ? "sunset" : "night";
  const gone = ph==="after" ? D.staff.filter(x=>personPhase(x.id,D.current)==="after").length : 0;
  if (dates[idx]===D.current && ((lastPhase && ph!==lastPhase) || (lastGone>=0 && gone!==lastGone))) render();
  const bk = live ? (breakOf(D.current)?.id || null) : null;
  if (live && lastBreak!==undefined && bk!==lastBreak && lastPhase) render();
  lastBreak = bk;
  const wk = live ? (()=>{ const w=workCommuters(D.current); return w.come.map(x=>x.id).join()+"|"+w.go.map(x=>x.id).join()+"|"+w.dir; })() : "";
  if (live && lastWk!==undefined && wk!==lastWk && lastPhase) render();
  lastWk = wk;
  lastPhase = ph; lastGone = gone;
  const toMin = t => { const [a,b]=t.split(":").map(Number); return a*60+b; };
  const cur = now.getUTCHours()*60+m, st = toMin(D.hours.start), en = toMin(D.hours.end);
  const wd = now.getUTCDay(), weekend = wd===0||wd===6;
  const left = x => x>=60 ? T(`${Math.floor(x/60)}시간 ${x%60}분`, `${Math.floor(x/60)} ชม. ${x%60} นาที`) : T(`${x}분`, `${x} นาที`);
  const [label, sub] = weekend ? [T("주말","วันหยุด"), `${T("근무","เวลางาน")} ${D.hours.start}–${D.hours.end}`]
    : cur < st ? [T("출근 전","ก่อนเข้างาน"), T(`${D.hours.start} 출근까지 ${left(st-cur)}`, `อีก ${left(st-cur)} เข้างาน ${D.hours.start}`)]
    : cur < en ? [T("근무 중","เวลางาน"), T(`${D.hours.end} 퇴근까지 ${left(en-cur)}`, `อีก ${left(en-cur)} เลิกงาน ${D.hours.end}`)]
    : [T("퇴근 후","หลังเลิกงาน"), T("퇴근 보고 확인 시간","เวลาส่งรายงานผลงาน")];
  const bnow = breakOf(D.current);
  document.getElementById("workstate").innerHTML = bnow ? `<b>${bnow.icon} ${T(bnow.ko, bnow.th)}</b>${T(`${bnow.to}까지`, `ถึง ${bnow.to}`)}` : `<b>${label}</b>${sub}`;
}

];
const ST_KW = [
  ["final",/🏁|เสร็จงานโปรเจ|เสร็จโปรเจ|ปิดโปรเจ|โปรเจ[คก]ต?เสร็จ|ส่งงานสุดท้าย|최종 완료/i],
  ["done",/✅|✔|☑|(?<!ใบ)เสร็จ|เรียบร้อย|\bdone\b|finished|completed|완료/i],
  ["blocked",/❌|🙋|ติดปัญหา|ติดขัด|ขอความช่วยเหลือ|ต้องการความช่วยเหลือ|ช่วยด้วย|blocked|막힘|도움/i],
  ["moved",/เลื่อนไป|ยกไป|postpone|이월/i],
  ["doing",/⏳|🔄|กำลัง|ระหว่างทำ|ทำต่อ|\bdoing\b|in progress|진행/i],
];
function guessProj(t){
  for(const [k,re] of PROJ_KW) if(D.projects[k] && re.test(t)) return k;
  for(const [k,v] of Object.entries(D.projects)) if((v.th && t.includes(v.th)) || (v.ko && t.includes(v.ko))) return k;
  return "";
}
function guessStatus(t){ for(const [k,re] of ST_KW) if(re.test(t)) return k; return "plan"; }
function parseLine(text, st){
  const skipHead = /^(today|tomorrow|this week|to\s*do|วันนี้|งานวันนี้|สิ่งที่ต้องทำ|แผนงาน|สรุปงาน|รายงาน|ผลงาน|สัปดาห์นี้|ประจำวัน|อัปเดต|update)\s*[:：\-]?\s*$/i;
  const names = st ? [st.name, st.kname, st.id].filter(Boolean).map(x=>x.toLowerCase()) : [];
  const out = [];
  text.split(/\r?\n/).forEach(raw=>{
    let l = raw.trim(); if(!l) return;
    if(skipHead.test(l)) return;
    if(/^[\d\s\/\.\-]+$/.test(l)) return;                         // 날짜만 있는 줄
    if(names.length && names.some(n=>l.toLowerCase().replace(/[^\p{L}\s]/gu,"").trim().split(/\s+/).every(w=>w===n || names.includes(w)))) return; // 이름만 있는 줄
    const s = guessStatus(l);
    l = l.replace(/^(\s*[-–—•·*▪︎▫️◦●○■□➤►▶︎>]+|\s*\d{1,2}\s*[\.\)]|\s*[✅✔☑❌⏳🔄🏁📌📝🔸🔹⭐️]+)\s*/u, "");
    l = l.replace(/^\s*[✅✔☑❌⏳🔄🏁]\s*/u,"").replace(/\s*[✅✔☑❌⏳🔄🏁]+\s*$/u,"").trim();
    if(!l || l.length < 2) return;
    out.push({p:guessProj(l), txt:l, s});
  });
  return out.slice(0,20);
}

/* ===== 주요 일정 (data.json events + Firebase office_events) ===== */
let FEV = {};
const WD_KO=["일","월","화","수","목","금","토"];
function evDate(s){ const d=parse(s); return `${d.getUTCMonth()+1}/${d.getUTCDate()}(${T(WD_KO[d.getUTCDay()],WD_TH[d.getUTCDay()])})`; }
function dayDiff(a,b){ return Math.round((parse(a)-parse(b))/864e5); }
function boardItems(){
  const today=D.current;
  const all=[...(D.events||[]).map(e=>({...e,src:"file"})), ...(D.notices||[]).map(e=>({...e,kind:"notice",src:"file"})), ...Object.entries(FEV).filter(([k,e])=>e.kind!=="status" && e.kind!=="dirleave").map(([k,e])=>({...e,_id:k,src:"fb"}))];
  const notices=all.filter(e=>e.kind==="notice" && (!e.until || e.until>=today) && (!e.date || e.date<=today || true)).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  const events=all.filter(e=>e.kind!=="notice" && e.date && (e.end||e.date)>=today).sort((a,b)=>a.date.localeCompare(b.date));
  return {notices, events};
}
const evTitle = e => LANG==="th" ? (e.th||e.ko) : (e.ko||e.th);
function evTag(e){ const today=D.current, dd=dayDiff(e.date,today), on=e.date<=today && (e.end||e.date)>=today;
  return { tag: on ? T("진행 중","วันนี้") : dd===0 ? "D-day" : `D-${dd}`, cls: on||dd===0 ? "today" : dd<=7 ? "soon" : "" }; }
function evWhen(e){ return (e.end && e.end!==e.date ? `${evDate(e.date)}~${evDate(e.end)}` : evDate(e.date)) + (e.time ? ` ${e.time}` : ""); }
function renderEvents(){
  const box=document.getElementById("board"); if(!box || !D) return;
  const {notices, events} = boardItems();
  const N=notices.slice(0,2), E=events.slice(0, Math.max(1, 4-N.length)), more=notices.length+events.length-N.length-E.length;
  const rot = i => [-2.2,1.6,-1.1,2.4,-1.8][i%5];
  let i=0;
  const notes = [
    ...N.map(e=>`<button type="button" class="note n-notice" style="--r:${rot(i++)}deg" data-k="${e._id||""}"><span class="pin"></span><b>📌 ${T("공지","ประกาศ")}</b><span class="t">${esc(evTitle(e))}</span></button>`),
    ...E.map(e=>{ const g=evTag(e); return `<button type="button" class="note n-event ${g.cls}" style="--r:${rot(i++)}deg" data-k="${e._id||""}"><span class="pin"></span><b><span class="dd">${g.tag}</span> ${evWhen(e)}</b><span class="t">${esc(evTitle(e))}</span></button>`; }),
  ];
  if (more>0) notes.push(`<button type="button" class="note n-more" style="--r:${rot(i++)}deg"><span class="pin"></span>+${more}<br><small>${T("더 보기","ดูเพิ่ม")}</small></button>`);
  const empty = !notes.length ? `<span class="b-empty">${T("📋 게시판이 비어 있어요","📋 ยังไม่มีประกาศ")}</span>` : "";
  const add = adminUser && fdb ? `<button type="button" class="b-add" id="bAdd" title="공지·일정 추가">＋</button>` : "";
  box.innerHTML = `<div class="b-notes">${notes.join("")}${empty}</div>${add}`;
  // 넘치는 메모는 떼어 내고 "+N"으로 모으기
  const wrap = box.querySelector(".b-notes");
  let extra = 0;
  const fit = () => {
    while (wrap.scrollWidth > wrap.clientWidth + 2) {
      const normals = wrap.querySelectorAll(".note:not(.n-more)"); if (normals.length <= 1) break;
      normals[normals.length-1].remove(); extra++;
      let m = wrap.querySelector(".n-more");
      if (!m){ wrap.insertAdjacentHTML("beforeend", `<button type="button" class="note n-more" style="--r:2deg"><span class="pin"></span>+0<br><small>${T("더 보기","ดูเพิ่ม")}</small></button>`); m = wrap.querySelector(".n-more"); }
      m.firstChild.nextSibling.textContent = "+" + (more + extra);
    }
  };
  fit();
  box.querySelectorAll(".note").forEach(b=>b.onclick=()=>openBoardList());
  const a=document.getElementById("bAdd"); if(a) a.onclick=e=>{ e.stopPropagation(); openEvForm(null,"pick"); };
}
let _bt; window.addEventListener("resize",()=>{ clearTimeout(_bt); _bt=setTimeout(()=>renderEvents(),200); });
function openBoardList(){
  const {notices, events} = boardItems();
  const row = (e,isN) => { const g=isN?null:evTag(e); const ed = adminUser && e.src==="fb";
    return `<div class="bl-row ${ed?"ed":""}" ${ed?`data-ev="${e._id}"`:""}>${isN?`<span class="bl-tag n">📌</span>`:`<span class="bl-tag ${g.cls}">${g.tag}</span>`}<div><div class="bl-t">${esc(evTitle(e))}</div><div class="bl-d">${isN ? (e.until? T(`~ ${evDate(e.until)}까지`,`ถึง ${evDate(e.until)}`) : "") : evWhen(e)}</div></div>${ed?`<span class="bl-edit">✏️</span>`:""}</div>`; };
  admModal(`<h3>📋 ${T("게시판","บอร์ดประกาศ")}</h3>
    ${notices.length?`<div class="bl-h">📌 ${T("공지","ประกาศ")}</div>${notices.map(e=>row(e,true)).join("")}`:""}
    ${events.length?`<div class="bl-h">📅 ${T("주요 일정","กำหนดการสำคัญ")}</div>${events.map(e=>row(e,false)).join("")}`:""}
    ${!notices.length&&!events.length?`<p>${T("아직 아무것도 없어요","ยังไม่มีอะไร")}</p>`:""}
    <div class="row">${adminUser&&fdb?`<button type="button" id="blAdd" style="margin-right:auto">＋ 추가</button>`:""}<button class="pri" id="blX">${T("닫기","ปิด")}</button></div>`, w=>{
      w.querySelector(".admbox").classList.add("wide");
      w.querySelector("#blX").onclick=()=>w.remove();
      const ad=w.querySelector("#blAdd"); if(ad) ad.onclick=()=>{ w.remove(); openEvForm(null,"pick"); };
      w.querySelectorAll(".bl-row.ed").forEach(r=>r.onclick=()=>{ w.remove(); openEvForm(r.dataset.ev); });
  });
}

  });

  Promise.all([import("https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js"),import("https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js"),import("https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js")]).then(([appM,authM,fsM])=>{
    const app=appM.initializeApp(FB_CONFIG); fa=authM; fauth=fa.getAuth(app);
    ffs=fsM; fdb=ffs.getFirestore(app);
    const startSync=()=>{ if(!D){ setTimeout(startSync,300); return; } ffs.onSnapshot(ffs.collection(fdb,"office_reports"), snap=>{ STAFF_DOCS={}; snap.forEach(d=>STAFF_DOCS[d.id]=d.data()); applyStaffDocs(); }, err=>console.warn("office_reports", err.code)); };
    startSync();
    ffs.onSnapshot(ffs.doc(fdb,"office_server","state"), d=>{ SERVER = d.exists() ? d.data() : null; if (D) render(); }, err=>console.warn("office_server", err.code));
    ffs.onSnapshot(ffs.collection(fdb,"office_events"), snap=>{ FEV={}; snap.forEach(d=>FEV[d.id]=d.data()); if (D) render(); else renderEvents(); }, err=>console.warn("office_events", err.code));
    fa.onAuthStateChanged(fauth,u=>{ const was=!!adminUser; adminUser=u||null; STAFF=!adminUser;
      if(adminUser && !was) LANG="ko"; if(!adminUser && was) LANG="th";
      paintAdm(); if(D){ try{ closeDrawer(); }catch(e){} render(); tickClock(); if(window.drawLegend) drawLegend(); } });
  }).catch(()=>{});
}
paintAdm();
document.querySelectorAll(".langsw button").forEach(b=>b.onclick=()=>{ LANG=b.dataset.lang; try{localStorage.setItem("cgnLang",LANG);}catch(e){} closeDrawer(); render(); tickClock(); if(window.drawLegend) drawLegend(); });
document.getElementById("scrim").onclick = closeDrawer;
document.getElementById("closeBtn").onclick = closeDrawer;
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeDrawer(); });
document.getElementById("prev").onclick = ()=>{ if(idx>0){idx--;render();tickClock();} };
document.getElementById("next").onclick = ()=>{ if(idx<dates.length-1){idx++;render();tickClock();} };

fetch("data.json",{cache:"no-store"}).then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); }).then(data=>{
  D = data;
  { const td = fmt(nowBKK()); if (td > D.current) D.current = td; }
  BASE = {days: clone(D.days), checkin: clone(D.checkin), weeks: clone(D.weeks)};
  dates = [...new Set([...Object.keys(D.days), D.current])].sort();
  idx = dates.indexOf(D.current);
  window.drawLegend = () => { document.getElementById("legend").innerHTML = Object.entries(STATUS).map(([k,s])=>`<span><span class="dot" style="background:${s.c}"></span>${stLabel(k)}</span>`).join("")
    + T(`<span>✨ 모두 완료</span><span>🙋 도움 필요</span>`, `<span>✨ เสร็จทั้งหมด</span><span>🙋 ต้องการความช่วยเหลือ</span>`); };
  drawLegend();
  tickClock(); setInterval(tickClock, 30000);
  render();
  initDB();
}).catch(err=>{
  document.querySelector(".office").innerHTML = `<div class="err">업무 데이터를 불러오지 못했어요 (${esc(err.message)}). 잠시 후 새로고침해 주세요.</div>`;
});
</script>
</body>
